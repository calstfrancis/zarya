app-id: io.github.calstfrancis.zarya
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: zarya

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-config/autostart:create
  - --share=network
  - --talk-name=org.freedesktop.secrets

modules:
  - name: zarya
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/calstfrancis/zarya.git
        branch: main
      - type: file
        path: io.github.calstfrancis.zarya.metainfo.xml
    build-commands:
      - pip3 install --prefix=/app --no-build-isolation .
      - install -Dm644 io.github.calstfrancis.zarya.desktop /app/share/applications/io.github.calstfrancis.zarya.desktop
      - install -Dm644 zarya/data/io.github.calstfrancis.zarya.svg /app/share/icons/hicolor/scalable/apps/io.github.calstfrancis.zarya.svg
      - install -Dm644 io.github.calstfrancis.zarya.metainfo.xml /app/share/metainfo/io.github.calstfrancis.zarya.metainfo.xml
