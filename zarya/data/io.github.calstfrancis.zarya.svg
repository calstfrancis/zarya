      <rect x="38" y="84" width="52" height="5" fill="#8B2F5C"/>
      <rect x="38" y="93" width="52" height="7" fill="#8B2F5C"/>
    </g>

    <g stroke="#E2604A" stroke-width="1.6" opacity="0.85">
      <line x1="64" y1="78" x2="14" y2="120"/>
      <line x1="64" y1="78" x2="39" y2="120"/>
      <line x1="64" y1="78" x2="64" y2="120"/>
      <line x1="64" y1="78" x2="89" y2="120"/>
      <line x1="64" y1="78" x2="114" y2="120"/>
    </g>
    <g stroke="#F6ECD9" stroke-width="1.4" opacity="0.55">
      <line x1="8" y1="86" x2="120" y2="86"/>
      <line x1="8" y1="96" x2="120" y2="96"/>
      <line x1="8" y1="108" x2="120" y2="108"/>
    </g>
