<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C2F5C"/>
      <stop offset="0.45" stop-color="#4E3E76"/>
      <stop offset="0.72" stop-color="#8B2F5C"/>
      <stop offset="1" stop-color="#E2604A"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B87E"/>
      <stop offset="1" stop-color="#E2604A"/>
